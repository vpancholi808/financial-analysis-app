name: Verify financial analysis platform
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'finance_models.py'
      - 'build_universe.py'
      - 'research.py'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/validation.yml'

permissions:
  contents: read

jobs:
  accounting-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies and tests
        run: python -m pip install -r requirements.txt pytest
      - name: Compile Python files
        run: python -m compileall -q app.py finance_models.py build_universe.py research.py
      - name: Run model and extraction tests
        run: python -m pytest -q
      - name: Fetch real Yahoo Finance fundamentals for selected tickers
        run: |
          python build_universe.py --tickers AAPL MSFT NVDA --limit 3 --pause 1.0 --output real_test_universe.csv
          python - <<'PY'
          import pandas as pd
          d = pd.read_csv('real_test_universe.csv')
          assert len(d) > 0, 'No actual company records fetched from Yahoo Finance. See preceding errors.'
          assert d['data_source'].str.contains('yfinance', case=False).all()
          assert d['total_assets'].notna().all()
          print('Verified real-company financial-statement rows:', len(d))
          print(d[['ticker','fiscal_year_end','total_assets','net_income','operating_cash_flow']].to_string(index=False))
          PY
      - name: Preserve fetched pilot dataset for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yahoo-real-data-smoke
          path: real_test_universe.csv
          if-no-files-found: ignore
