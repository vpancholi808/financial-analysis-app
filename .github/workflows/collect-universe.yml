name: Collect US company fundamentals
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/collect-universe.yml'
      - 'collect_universe_batch.py'
  workflow_dispatch:
  schedule:
    - cron: '27 * * * *'
permissions:
  contents: write
concurrency:
  group: yahoo-financial-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fetch next batch of genuine financial statements
        id: fetch
        continue-on-error: true
        run: python collect_universe_batch.py --target 1000 --batch-size 90 --pause 1.2
      - name: Validate data integrity
        run: |
          python - <<'PY'
          import pandas as pd
          d=pd.read_csv('universe.csv')
          if len(d):
              assert d.ticker.nunique()==len(d)
              assert not d.ticker.str.upper().eq('TSM').any()
              assert (d.total_assets>0).all()
          print('Genuine records:',len(d))
          PY
      - name: Save collection progress to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add universe.csv collection_state.json
          if test -f candidate_quotes.json; then git add candidate_quotes.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "Update Yahoo-sourced company fundamentals [skip ci]"
            git push origin main
          fi
      - name: Report Yahoo collection failure
        if: steps.fetch.outcome == 'failure'
        run: exit 1
